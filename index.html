<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My App</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: white;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-container {
      position: relative;
    }

    .image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .text-on-image {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: blue;
      font-size: 28px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="image-container">
    <div class="text-on-image">hehe funny cat</div>
    <img src="https://cdn.discordapp.com/attachments/1458944241374986302/1468203596268175564/IMG_0904.jpg">
  </div>

</body>
</html>
